<title>Tejo: Club El Cosmo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: one full-bleed 3D hall; HUD pinned to the safe edges; menus are painted-wood panels over the live scene. Single dark look (evening tejo hall). */
:root{
  --night:#16110c; --wood:#2b2118; --wood-2:#3b2d20; --wood-3:#4c3a29;
  --paper:#f5eddd; --muted:#cdbb9c; --dim:#8e7d66;
  --red:#d8392d; --yellow:#f3c22f; --green:#2f915c; --blue:#2565b3;
  --greda:#8d8476; --ink:#120d08;
  --display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --flag-y:#fcd116; --flag-b:#003893; --flag-r:#ce1126;
  --stripes:linear-gradient(180deg,var(--flag-y) 0 50%,var(--flag-b) 50% 75%,var(--flag-r) 75% 100%);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--night);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;}
#board{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;}
#board.many .chip{flex:0 0 calc((100% - 12px) / 3);padding:5px 8px 6px;}
#board.many .chip .bar{display:none;}
#board.many .chip .sc{font-size:18px;}
.chip .mb{display:flex;gap:3px;flex-wrap:wrap;}
.chip .mb img{width:15px;height:15px;border-radius:50%;opacity:.5;}
.chip .mb img.on{opacity:1;box-shadow:0 0 0 1.5px var(--paper);}
.seg button[hidden]{display:none!important;}
.seg button:disabled{cursor:default;}
.chip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:7px 9px 8px;
  background:rgba(22,16,11,.82);border:1px solid rgba(245,237,221,.10);border-radius:4px;position:relative;overflow:hidden;
  transition:transform .25s ease, border-color .25s ease;}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);}
.chip.on{border-color:var(--c);transform:translateY(2px);box-shadow:0 0 0 1px var(--c) inset;}
.chip .nm{font-weight:600;font-size:12px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
.chip.on .nm{color:var(--paper);}
.chip .sc{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px;}
.chip .sc small{font-family:var(--body);font-size:11px;color:var(--dim);font-weight:600;}
.chip .bar{height:3px;background:rgba(245,237,221,.1);border-radius:2px;overflow:hidden;}
.chip .bar i{display:block;height:100%;background:var(--c);transition:width .5s ease;}
.chip.bump .sc{animation:bump .6s ease;}
@keyframes bump{30%{transform:scale(1.35);color:var(--yellow);}}

#lupa{position:absolute;right:max(12px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + var(--bh, 60px) + 18px);width:min(40vw,190px);aspect-ratio:1/1;
  border:3px solid var(--yellow);box-shadow:0 0 0 3px var(--ink),0 8px 24px rgba(0,0,0,.5);}
#lupa span{position:absolute;left:-3px;top:-3px;transform:translateY(-100%);background:var(--yellow);color:var(--ink);
  font:800 10px/1 var(--body);letter-spacing:.14em;padding:4px 6px 3px;}
#turn{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + var(--bh, 60px) + 20px);
  max-width:calc(100% - min(40vw,190px) - 48px);display:flex;flex-direction:column;gap:2px;}
#turn .who{font-family:var(--display);font-size:20px;line-height:1.05;text-shadow:0 2px 0 var(--ink);}
#turn .meta{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-shadow:0 1px 2px var(--ink);}
#gauge{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
  width:16px;height:min(34vh,260px);background:rgba(22,16,11,.8);border:2px solid rgba(245,237,221,.35);border-radius:3px;}
#gaugeFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--green),var(--yellow) 60%,var(--red));}
#gaugeLast{position:absolute;left:-7px;right:-7px;height:2px;background:var(--paper);bottom:0;display:none;}
#gaugeLast::after{content:"último";position:absolute;right:calc(100% + 4px);top:-7px;font-size:10px;color:var(--muted);font-weight:600;}
#gauge b{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:var(--muted);}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:min(86vw,420px);text-align:center;font-size:13px;font-weight:600;color:var(--paper);
  background:rgba(22,16,11,.78);padding:9px 14px;border-radius:999px;transition:opacity .3s;}
#hint.off{opacity:0;}
#hintClose{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  background:rgba(245,237,221,.14);color:var(--paper);font:700 17px/1 var(--body);pointer-events:auto;}
#hint.help{padding-right:40px;} #hint.help #hintClose{display:grid;place-items:center;} #hint.off #hintClose{pointer-events:none;}
#turn .clock{align-self:flex-start;margin-top:4px;font:400 18px/1 var(--display);color:var(--ink);background:var(--yellow);padding:5px 9px 4px;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink);}
#turn .clock.low{background:var(--red);color:var(--paper);animation:tick 1s steps(1) infinite;}
@keyframes tick{50%{transform:scale(1.08);}}
.skipBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);pointer-events:auto;font:800 14px var(--body);color:var(--ink);background:var(--yellow);padding:10px 16px;border-radius:3px;box-shadow:3px 3px 0 var(--red);white-space:nowrap;}
.chip.off{opacity:.5;}
#feed{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 72px);
  display:flex;flex-direction:column;gap:4px;max-width:62vw;}
#feed div{font-size:12px;font-weight:600;background:rgba(22,16,11,.72);padding:4px 8px;border-left:3px solid var(--c);
  border-radius:2px;animation:feedin .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@keyframes feedin{from{opacity:0;transform:translateX(-8px);}}
#rxTray{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);pointer-events:auto;z-index:3;
  display:grid;grid-template-columns:repeat(3,auto);gap:6px;background:var(--ink);padding:8px;border-radius:6px;border:1px solid var(--wood-3);box-shadow:0 10px 30px rgba(0,0,0,.5);}
#rxTray button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;min-width:64px;border-radius:4px;background:var(--wood);}
#rxTray button b{font-size:24px;line-height:1;}
#rxTray button span{font:600 11px/1 var(--body);color:var(--muted);}
#rxTray button:active{transform:scale(.94);}
#rxLayer{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 120px);z-index:30;pointer-events:none;
  display:flex;flex-direction:column-reverse;align-items:flex-end;gap:6px;}
.rx{display:flex;align-items:center;gap:8px;background:rgba(18,13,8,.88);border-left:4px solid var(--c);padding:6px 10px 6px 8px;border-radius:3px;
  animation:rxUp 3.2s ease-out forwards;max-width:70vw;}
.rx b{font-size:28px;line-height:1;}
.rx span{display:flex;flex-direction:column;gap:2px;font:600 12px/1.1 var(--body);color:var(--muted);min-width:0;}
.rx span em{font:400 15px/1 var(--display);font-style:normal;color:var(--paper);}
@keyframes rxUp{0%{opacity:0;transform:translateY(16px) scale(.8);}10%{opacity:1;transform:translateY(0) scale(1.06);}18%{transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateY(-40px);}}
@media (prefers-reduced-motion:reduce){.rx{animation:rxFade 3.2s linear forwards;}@keyframes rxFade{0%,80%{opacity:1;}100%{opacity:0;}}}
.hudBtns{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:8px;pointer-events:auto;}
.iconBtn{width:42px;height:42px;display:grid;place-items:center;background:rgba(22,16,11,.82);border:1px solid rgba(245,237,221,.18);border-radius:50%;}
.iconBtn svg{width:18px;height:18px;fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
#zoomBtns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px + min(34vh,260px) + 34px);display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
#zoomBtns .iconBtn:disabled{opacity:.35;}
.iconBtn.muted .wave{display:none;} .iconBtn:not(.muted) .x{display:none;}

/* ---------- announcements ---------- */
#announce{position:fixed;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0;}
#announce.show{animation:ann 1.9s cubic-bezier(.2,.9,.2,1) forwards;}
#announce .t{font-family:var(--display);font-size:clamp(40px,12vw,92px);line-height:.95;letter-spacing:.01em;color:var(--paper);
  text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink);padding:0 16px;text-align:center;}
#announce.big .t{font-size:clamp(52px,16vw,128px);text-shadow:3px 3px 0 var(--flag-y),6px 6px 0 var(--flag-b),9px 9px 0 var(--flag-r),12px 12px 0 var(--ink);}
#announce .p{font:800 16px/1 var(--body);letter-spacing:.08em;background:var(--ink);padding:7px 12px;border-top:4px solid var(--yellow);}
#announce .s{height:12px;width:min(70vw,360px);background:var(--stripes);}
@keyframes ann{0%{opacity:0;transform:scale(.6) rotate(-4deg);}12%{opacity:1;transform:scale(1.06) rotate(-2deg);}22%{transform:scale(1) rotate(-2deg);}80%{opacity:1;}100%{opacity:0;transform:scale(1) rotate(-2deg) translateY(-14px);}}
.btn.wide{flex:none;width:100%;}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;color:var(--muted);}
.steps b{color:var(--paper);}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:40;
  display:flex;align-items:center;gap:12px;background:var(--ink);border:2px solid var(--yellow);padding:8px 8px 8px 14px;border-radius:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);font:600 13px/1.2 var(--body);color:var(--paper);width:max-content;max-width:calc(100% - 32px);}
#updBar button{background:var(--yellow);color:var(--ink);font:400 15px/1 var(--display);padding:9px 12px;border-radius:3px;white-space:nowrap;}
#replayTag{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + var(--bh, 60px) + 20px);z-index:4;pointer-events:none;
  display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font:400 16px/1 var(--display);letter-spacing:.08em;padding:8px 12px 7px;border-bottom:4px solid var(--red);}
#replayTag i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:rec 1s steps(1) infinite;}
#replayTag span{font:600 11px/1 var(--body);letter-spacing:.04em;color:var(--muted);}
@keyframes rec{50%{opacity:0;}}
#flash{position:fixed;inset:0;background:#ffd38a;opacity:0;pointer-events:none;mix-blend-mode:screen;}
#flash.go{animation:flash .45s ease-out;}
@keyframes flash{0%{opacity:.75;}100%{opacity:0;}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);pointer-events:none;
  background:var(--ink);border:2px solid var(--yellow);padding:9px 14px;font-weight:800;font-size:14px;text-align:center;
  max-width:min(84vw,380px);opacity:0;transition:opacity .3s, transform .3s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(22,17,12,.35),rgba(22,17,12,.75));overflow-y:auto;}
.panel{width:min(100%,440px);max-height:100%;overflow-y:auto;background:var(--wood);border:1px solid var(--wood-3);
  box-shadow:0 20px 50px rgba(0,0,0,.55);border-radius:4px;position:relative;margin:auto;}
.panel::before{content:"";display:block;height:12px;background:var(--stripes);}
.pin{padding:18px 18px 20px;display:flex;flex-direction:column;gap:16px;}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
.brand .eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--yellow);text-transform:uppercase;}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(64px,22vw,96px);line-height:.85;
  color:var(--paper);text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink);letter-spacing:.01em;transform:translateX(-3px);}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.45;max-width:36ch;}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;text-wrap:balance;}
h3{margin:0;font:800 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.group{display:flex;flex-direction:column;gap:8px;}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--ink);padding:4px;border-radius:4px;}
.seg button{padding:10px 6px;border-radius:3px;font-weight:600;font-size:13px;color:var(--muted);line-height:1.15;}
.seg button small{display:block;font-size:10.5px;font-weight:600;color:var(--dim);margin-top:2px;}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);}
.seg button[aria-pressed="true"] small{color:#5d4f3e;}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.names label{display:flex;align-items:center;gap:6px;background:var(--ink);border-radius:3px;padding:0 8px;border-left:4px solid var(--c);min-width:0;}
.names input{flex:1;min-width:0;background:none;border:0;color:var(--paper);font:600 14px var(--body);padding:10px 0;user-select:text;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.row .lbl{display:flex;flex-direction:column;gap:2px;min-width:0;}
.row .lbl b{font-size:14px;font-weight:600;}
.row .lbl span{font-size:12px;color:var(--dim);}
.switch{width:50px;height:28px;border-radius:999px;background:var(--ink);position:relative;flex:none;border:1px solid var(--wood-3);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s, background .2s;}
.switch[aria-checked="true"]{background:var(--green);}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--paper);}
.switch:disabled{opacity:.35;cursor:not-allowed;}
.row.off .lbl b{opacity:.5;}
#gauge[hidden]{display:none!important;}
.cta{display:flex;gap:8px;flex-wrap:wrap;}
.btn{flex:1 1 140px;padding:14px 16px;font-family:var(--display);font-size:19px;letter-spacing:.02em;background:var(--yellow);color:var(--ink);
  border-radius:3px;box-shadow:4px 4px 0 var(--red);transition:transform .08s, box-shadow .08s;}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red);}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:none;border:2px solid var(--wood-3);font-family:var(--body);font-weight:800;font-size:15px;}
.record{font-size:12px;color:var(--muted);}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:-4px;}
.ver{margin-left:auto;font:800 11px/1 var(--body);letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
.rulesT{width:100%;border-collapse:collapse;font-size:14px;}
.rulesT td{padding:9px 4px;border-bottom:1px solid var(--wood-2);vertical-align:top;}
.rulesT td:first-child{font-family:var(--display);font-size:16px;white-space:nowrap;padding-right:10px;}
.rulesT td:last-child{text-align:right;font-family:var(--display);font-size:20px;color:var(--yellow);font-variant-numeric:tabular-nums;}
.rulesT span{display:block;font-size:12.5px;color:var(--muted);font-family:var(--body);margin-top:2px;line-height:1.4;}
.prose{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);}
.prose b{color:var(--paper);}
.stats{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
.stats th,.stats td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--wood-2);}
.stats th{font-size:10.5px;letter-spacing:.08em;color:var(--dim);font-weight:800;text-transform:uppercase;}
.stats td:first-child,.stats th:first-child{text-align:left;}
.stats td:first-child{font-weight:600;border-left:4px solid var(--c);padding-left:8px;}
.stats tr.win td{color:var(--yellow);}
.winner{font-family:var(--display);font-size:clamp(34px,10vw,48px);line-height:1;color:var(--paper);text-shadow:3px 3px 0 var(--red);}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);color:var(--muted);font-weight:600;z-index:5;}
.joinRow{display:flex;gap:8px;}
.joinRow input{flex:1;min-width:0;background:var(--ink);border:0;border-left:4px solid var(--flag-y);border-radius:3px;color:var(--paper);font:800 18px var(--body);letter-spacing:.2em;padding:10px 12px;user-select:text;}
.joinRow input::placeholder{letter-spacing:.02em;font-weight:600;font-size:14px;color:var(--dim);}
.joinRow .btn{flex:0 0 auto;font-size:15px;padding:12px 16px;}
.btn:disabled,.joinRow input:disabled{opacity:.45;cursor:not-allowed;}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);padding:12px 14px;border-radius:3px;border-left:4px solid var(--flag-y);}
.code div{display:flex;flex-direction:column;gap:4px;}
.code small{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--dim);}
.code b{font-family:var(--display);font-size:46px;letter-spacing:.14em;line-height:1;color:var(--flag-y);font-weight:400;font-variant-numeric:tabular-nums;}
.code button{font-weight:800;font-size:13px;padding:9px 12px;border:2px solid var(--wood-3);border-radius:3px;}
.mini{font-weight:800;font-size:13px;padding:8px 12px;border:2px solid var(--wood-3);border-radius:3px;color:var(--paper);}
.mini:disabled{opacity:.45;}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.seats li{display:flex;align-items:center;gap:10px;background:var(--ink);padding:11px 12px;border-left:4px solid var(--c);border-radius:3px;min-width:0;}
.seats li b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.seats li span{margin-left:auto;font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:800;white-space:nowrap;}
.seats li.off{opacity:.5;}
.names label{padding-left:4px;}
.dz{flex:none;width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center;}
.dz img,.ic{border-radius:50%;display:block;}
.dz img{width:34px;height:34px;box-shadow:0 0 0 2px rgba(245,237,221,.18);}
.chip .nm{display:flex;align-items:center;gap:5px;}
.chip .nm .ic{width:16px;height:16px;flex:none;}
.seats li .ic{width:26px;height:26px;flex:none;}
.myDz{display:flex;align-items:center;gap:12px;background:var(--ink);padding:10px 12px;border-radius:3px;text-align:left;border-left:4px solid var(--flag-y);}
.myDz img{width:44px;height:44px;border-radius:50%;flex:none;}
.myDz span{display:flex;flex-direction:column;gap:4px;min-width:0;}
